<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> css 盒模型</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    html {
      width: 100vw;
      height: 100vh;
    }

    body {
      width: 100%;
      height: 100%;
    }

    .box {
      /* margin-top: 10px; */
      border: 3px solid #f00;
      padding: 10px;
      position: absolute;
      top: 300px;
      left: 200px;
      width: 100px;
      height: 100px;
      background: #ff0;
      overflow-y: scroll;
    }

    .scroll {
      width: 100%;
      height: 200%;
    }
  </style>
</head>

<body>


  <div style="position: relative;top:100px">
    <div class="box">
      <div style="height: 300px;"></div>
    </div>
  </div>

  <div class="scroll" style="color: #ccc"></div>
  <script src="./index.js"></script>

</body>

</html>
