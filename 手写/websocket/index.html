<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Demo</title>
  <style>
    body { font-family: monospace; max-width: 600px; margin: 40px auto; }
    #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 6px; }
    button { padding: 6px 16px; }
    .status { color: #888; }
    .recv { color: green; }
    .send { color: blue; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>WebSocket Demo</h2>
  <div>状态:<span id="status">connecting...</span></div>
  <div id="log"></div>
  <div class="row">
    <input id="input" placeholder="输入消息">
    <button onclick="send()">发送</button>
    <button onclick="ws.close()">主动断开</button>
  </div>

  <script src="./client.js"></script>
  <script>
    const log = (msg, type = '') => {
      const div = document.createElement('div')
      div.className = type
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
      document.getElementById('log').appendChild(div)
      document.getElementById('log').scrollTop = 1e9
    }

    ws.on('open', () => {
      document.getElementById('status').textContent = '已连接'
      log('connected', 'status')
    })
    ws.on('message', (data) => log('recv: ' + data, 'recv'))
    ws.on('close', () => {
      document.getElementById('status').textContent = '已断开'
      log('closed', 'status')
    })
    ws.on('error', () => log('error', 'error'))

    function send() {
      const input = document.getElementById('input')
      if (!input.value) return
      ws.send(input.value)
      log('send: ' + input.value, 'send')
      input.value = ''
    }
  </script>
</body>
</html>
